name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          enable-cache: true

      - name: Sync locked environment
        run: uv sync --locked --all-groups

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type-check
        run: uv run ty check src tests

      - name: Test mutation and round-trip oracles
        run: uv run pytest

      - name: Check generated catalog
        run: uv run ipsw-diff-catalog render --check

      - name: Check major 26 migration plan
        run: >-
          uv run ipsw-diff-catalog plan
          --policy migration/major-26.json
          --census migration/census.json
          --output migration/specs-26
          --check

      - name: Check major 18 migration plan
        run: >-
          uv run ipsw-diff-catalog plan
          --policy migration/major-18.json
          --census migration/census.json
          --output migration/specs-18
          --check

      - name: Fetch pinned AppleDB metadata commit
        env:
          APPLEDB_COMMIT: 3051f8643eaf5d6d7196fb3c01a0f9ade46f1dc7
        run: |
          set -euo pipefail
          git init --quiet --object-format=sha1 appledb
          git -C appledb remote add origin https://github.com/littlebyteorg/appledb.git
          git -C appledb sparse-checkout init --cone
          git -C appledb sparse-checkout set osFiles/iOS osFiles/macOS
          git -C appledb -c protocol.version=2 fetch \
            --no-tags --depth=1 --filter=blob:none origin "$APPLEDB_COMMIT"
          observed="$(git -C appledb rev-parse FETCH_HEAD)"
          test "$observed" = "$APPLEDB_COMMIT"
          git -C appledb checkout --quiet --detach "$APPLEDB_COMMIT"

      - name: Check curated release metadata
        run: >-
          uv run ipsw-diff-catalog release-metadata
          --appledb-repo appledb
          --appledb-commit 3051f8643eaf5d6d7196fb3c01a0f9ade46f1dc7
          --output metadata/releases.json
          --check

      - name: Re-audit immutable source and destination commits
        run: uv run ipsw-diff-catalog audit
