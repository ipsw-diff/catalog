name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          enable-cache: true

      - name: Sync locked environment
        run: uv sync --locked --all-groups

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type-check
        run: uv run ty check src tests

      - name: Test mutation and round-trip oracles
        run: uv run pytest

      - name: Check generated catalog
        run: uv run ipsw-diff-catalog render --check

      - name: Check major 26 migration plan
        run: >-
          uv run ipsw-diff-catalog plan
          --policy migration/major-26.json
          --census migration/census.json
          --output migration/specs-26
          --check

      - name: Re-audit immutable source and destination commits
        run: uv run ipsw-diff-catalog audit
