name: Discover firmware candidate

on:
  workflow_call:
    inputs:
      policy-path:
        description: Repository-relative track policy path
        required: true
        type: string
      manifests-dir:
        description: Repository-relative merged manifests directory
        required: true
        type: string
    outputs:
      status:
        description: Either current or candidate
        value: ${{ jobs.detect.outputs.status }}
      result:
        description: Canonical discovery decision JSON
        value: ${{ jobs.detect.outputs.result }}

permissions: {}

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      status: ${{ steps.discover.outputs.status }}
      result: ${{ steps.discover.outputs.result }}
    steps:
      - name: Checkout shard
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: shard
          persist-credentials: false

      - name: Checkout detector at called workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: catalog
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          enable-cache: true

      - name: Sync locked detector environment
        working-directory: catalog
        run: uv sync --locked --all-groups

      - name: Cache AppleDB
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.config/ipsw
          key: appledb-v1-${{ runner.os }}

      - name: Install pinned ipsw
        env:
          IPSW_URL: https://github.com/blacktop/ipsw/releases/download/v3.1.707/ipsw_3.1.707_linux_x86_64.tar.gz
          IPSW_SHA256: 002113c7b9eaf4d06d5bb77dcbeb809f9b942ff18ba9fe906f3a8d2aab12df00
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ipsw.tar.gz"
          install_dir="$RUNNER_TEMP/ipsw-bin"
          curl --fail --location --silent --show-error --output "$archive" "$IPSW_URL"
          printf '%s  %s\n' "$IPSW_SHA256" "$archive" | sha256sum --check --strict
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir" ipsw
          printf '%s\n' "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/ipsw" version

      - name: Detect latest exact-track build
        id: discover
        working-directory: catalog
        env:
          GITHUB_TOKEN: ${{ github.token }}
          POLICY_PATH: ${{ inputs.policy-path }}
          MANIFESTS_DIR: ${{ inputs.manifests-dir }}
        run: |
          set -euo pipefail
          result="$(uv run ipsw-diff-catalog discover \
            --policy "../shard/$POLICY_PATH" \
            --manifests-dir "../shard/$MANIFESTS_DIR")"
          status="$(printf '%s' "$result" | jq --exit-status --raw-output '.status')"
          if [ "$status" != current ] && [ "$status" != candidate ]; then
            echo "unsupported discovery status: $status" >&2
            exit 1
          fi
          printf '%s\n' "$result" | tee "$RUNNER_TEMP/discovery.json"
          {
            printf 'status=%s\n' "$status"
            printf 'result=%s\n' "$result"
          } >> "$GITHUB_OUTPUT"

      - name: Summarize decision
        run: |
          {
            echo '### iOS 27 firmware discovery'
            echo
            echo '```json'
            cat "$RUNNER_TEMP/discovery.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
